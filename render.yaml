# Blueprint do Render: New + > Blueprint > apontar para este repo.
# Deploy automático a cada push na main (autoDeploy default).
services:
  - type: web
    name: quote-agent
    runtime: docker
    region: virginia
    plan: starter        # sempre de pé (free hiberna e dá cold start de ~1 min na demo)
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: ANTHROPIC_API_KEY
        sync: false      # preencher no painel do Render
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: LLM_MAX_TOKENS
        value: "1024"
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_HOST
        value: https://us.cloud.langfuse.com
      - key: FEATHERLESS_API_KEY
        sync: false
      - key: FEATHERLESS_BASE_URL
        value: https://api.featherless.ai/v1
      - key: FEATHERLESS_MODEL
        value: Qwen/Qwen2.5-72B-Instruct
      - key: WA_SERVICE_URL
        value: https://quote-agent-wa.onrender.com
      - key: WA_SHARED_TOKEN
        fromService:
          type: web
          name: quote-agent-wa
          envVarKey: WA_SHARED_TOKEN

  # WhatsApp (Baileys, instância única). Auth state no disco persistente:
  # pareamento sobrevive a deploys/restarts.
  - type: web
    name: quote-agent-wa
    runtime: docker
    region: virginia
    plan: starter
    rootDir: wa-service
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    disk:
      name: wa-auth
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: WA_SHARED_TOKEN
        generateValue: true
      - key: WEBHOOK_URL
        value: https://quote-agent.onrender.com/webhooks/wa
      - key: AUTH_DIR
        value: /data/auth
