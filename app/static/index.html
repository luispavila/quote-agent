<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CotaAI — Compras para construção civil</title>
  <link rel="icon" href="/static/assets/cotaai-logo.png">
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="/static/blue.css">
  <link rel="stylesheet" href="/static/public.css">
  <link rel="stylesheet" href="/static/logo.css">
</head>
<body>
  <div id="public-root"></div>
  <div id="product-shell" class="shell hidden">
    <aside class="sidebar">
      <div class="brand"><img src="/static/assets/cotaai-logo.png" alt="CotaAI"></div>
      <nav>
        <small>PRINCIPAL</small>
        <button data-page="dashboard">Dashboard</button>
        <button data-page="new">Nova cotação</button>
        <button data-page="quotes">Cotações</button>
        <button data-page="budgets">Orçamentos</button>
        <small>CADASTROS</small>
        <button data-page="suppliers">Fornecedores</button>
        <button data-page="ranking">Ranking</button>
        <button data-page="works">Obras</button>
        <button data-page="materials">Materiais</button>
        <small>SISTEMA</small>
        <button data-page="whatsapp">WhatsApp</button>
        <button data-page="plans">Assinatura</button>
        <button data-page="settings">Configurações</button>
      </nav>
      <footer><strong>Construtora Horizonte</strong><span>Marina Costa</span><button id="logout">Sair da conta</button></footer>
    </aside>
    <main id="app"><div class="loading">Carregando operação...</div></main>
  </div>
  <div id="toast" class="toast hidden"></div>
  <script src="/static/app.js"></script>
</body>
</html>
