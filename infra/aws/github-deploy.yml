name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPO: quote-agent

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build e push da imagem
        id: build
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPO:${GITHUB_SHA::12}"
          docker build -t "$IMAGE" -t "$REGISTRY/$ECR_REPO:latest" .
          docker push "$IMAGE"
          docker push "$REGISTRY/$ECR_REPO:latest"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy na EC2 via SSM
        env:
          IMAGE: ${{ steps.build.outputs.image }}
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy $IMAGE" \
            --parameters "commands=[
              \"set -euo pipefail\",
              \"cd /opt/quote-agent\",
              \"aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin ${IMAGE%%/*}\",
              \"echo API_IMAGE=$IMAGE > image.env\",
              \"docker compose --env-file .env --env-file image.env pull api\",
              \"docker compose --env-file .env --env-file image.env up -d --remove-orphans\",
              \"docker image prune -f\"
            ]" \
            --query 'Command.CommandId' --output text)
          echo "SSM command: $CMD_ID"
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true
          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query Status --output text)
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '{status:Status,stdout:StandardOutputContent,stderr:StandardErrorContent}' --output json
          [ "$STATUS" = "Success" ]

      - name: Smoke test /health
        env:
          BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "PUBLIC_BASE_URL não configurado — pulando smoke test remoto"
            exit 0
          fi
          for i in $(seq 1 12); do
            if curl -fsS "$BASE_URL/health"; then echo; echo "✅ produção no ar"; exit 0; fi
            echo "aguardando app subir ($i/12)…"; sleep 5
          done
          echo "❌ /health não respondeu"; exit 1
